<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ردود القسم · قسم التربية الإسلامية</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a6e4b">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
/* ردود القسم: رد المعلم على استفسار ولي الأمر، مشفّر بالرقم الشخصي للطالب (PBKDF2-SHA256 ← AES-GCM) مثل صفحة الدرجات.
   البيانات في data/rudud.json وتنضاف بـ src/add_reply.py. الرقم الشخصي لا يُحفظ في أي مكان. */
:root{--bg:#f7f3ea;--card:#fffdf8;--fg:#13261d;--mute:#5b6b62;--green:#0a6e4b;--green-2:#0d8a5e;--green-soft:#e2f1e9;--gold:#a8750d;--gold-fill:#e8bd5c;--gold-soft:#fbf0d4;--bad:#a3352a;--bad-soft:#fbe4e0;--line:#e7dfcc;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--card:#18211c;--fg:#eef0e8;--mute:#a9b8ae;--green:#3fc08b;--green-2:#55d19c;--green-soft:#183a2b;--gold:#e8bd5c;--gold-fill:#e9b44c;--gold-soft:#3a2f14;--bad:#f19a8e;--bad-soft:#45231e;--line:#2a3830;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121815;--card:#18211c;--fg:#eef0e8;--mute:#a9b8ae;--green:#3fc08b;--green-2:#55d19c;--green-soft:#183a2b;--gold:#e8bd5c;--gold-fill:#e9b44c;--gold-soft:#3a2f14;--bad:#f19a8e;--bad-soft:#45231e;--line:#2a3830;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.75 "Readex Pro","Segoe UI",Tahoma,sans-serif;min-height:100vh;
  padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
main{max-width:560px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.top a{color:var(--green);text-decoration:none;font-weight:600;font-size:.95rem;display:inline-flex;align-items:center;gap:6px}
.top small{color:var(--mute);font-size:.8rem}
.hero{text-align:center;margin-bottom:22px}
.hero .badge{width:64px;height:64px;border-radius:20px;margin:0 auto 22px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--green),var(--green-2));color:#fff;box-shadow:0 10px 28px -10px var(--green)}
h1{font-family:"Aref Ruqaa",serif;font-size:2.3rem;line-height:1.6;margin:0;color:var(--green)}
.hero p{margin:6px 0 0;color:var(--mute);font-size:.95rem}
.orn{width:120px;height:3px;margin:12px auto 0;border-radius:3px;background:linear-gradient(90deg,transparent,var(--gold-fill),transparent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 20px;box-shadow:0 14px 34px -24px rgba(0,0,0,.35)}
label{display:block;font-weight:600;margin-bottom:8px}
.row{display:flex;gap:10px}
input{flex:1;min-width:0;font:inherit;font-size:1.25rem;letter-spacing:.18em;text-align:center;direction:ltr;padding:12px 14px;border-radius:14px;
  border:2px solid var(--line);background:var(--bg);color:var(--fg);outline:none;transition:border-color .2s}
input:focus{border-color:var(--gold-fill)}
button{font:inherit;font-weight:600;border:0;border-radius:14px;padding:12px 18px;cursor:pointer;background:var(--green);color:#fff;white-space:nowrap}
button:disabled{opacity:.6;cursor:wait}
.hint{margin:12px 0 0;color:var(--mute);font-size:.85rem}
.msg{margin-top:14px;padding:12px 14px;border-radius:14px;font-size:.92rem;display:none}
.msg.bad{display:block;background:var(--bad-soft);color:var(--bad)}
.msg.info{display:block;background:var(--gold-soft);color:var(--fg)}
.res{margin-top:18px;display:grid;gap:16px}
.rep{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;animation:in .5s ease both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rep-h{padding:14px 18px;background:linear-gradient(135deg,var(--green),var(--green-2));color:#fff}
.rep-h b{display:block;font-size:1.05rem}
.rep-h span{font-size:.82rem;opacity:.9}
.q{margin:16px 18px 0;padding:12px 14px;border-radius:14px;background:var(--bg);border:1px dashed var(--line);font-size:.92rem;color:var(--mute)}
.q b{color:var(--fg);display:block;font-size:.8rem;margin-bottom:2px}
.a{margin:14px 18px 18px;white-space:pre-line}
.a-who{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--gold);font-size:.9rem;margin-bottom:6px}
.a-who:before{content:"";width:22px;height:3px;border-radius:3px;background:var(--gold-fill)}
.foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
.foot a{color:var(--green);font-weight:600;text-decoration:none;padding:10px 16px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:.9rem}
.bellbox{margin-top:16px;background:var(--gold-soft);border:1px solid var(--gold-fill);border-radius:20px;padding:16px 18px;text-align:center}.bellbox b{display:block;font-size:1rem}.bellbox p{margin:6px 0 12px;color:var(--mute);font-size:.85rem}.bellbox button{background:var(--gold);color:#fff}
.sig{text-align:center;color:var(--mute);font-size:.78rem;margin-top:26px}
@media (prefers-reduced-motion:reduce){.rep{animation:none}}
</style>
</head>
<body>
<main>
  <div class="top">
    <a href="./#contact" id="back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>رجوع</a>
    <small>مدرسة ابن رشد الإعدادية للبنين</small>
  </div>
  <div class="hero">
    <div class="badge"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.6 8.6 0 0 1-3.8-.9L3 20l1.1-4.4A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/><path d="M8 10h8M8 14h5"/></svg></div>
    <h1>ردود القسم</h1>
    <p>هنا تلقى رد المعلم على استفسارك عن ابنك</p>
    <div class="orn"></div>
  </div>

  <form class="card" id="f" autocomplete="off">
    <label for="cpr">الرقم الشخصي للطالب</label>
    <div class="row">
      <input id="cpr" inputmode="numeric" maxlength="12" placeholder="•••••••••" aria-describedby="h">
      <button id="go" type="submit">اعرض الرد</button>
    </div>
    <p class="hint" id="h">الرد محمي، وما ينفتح إلا بالرقم الشخصي لابنك (9 أرقام). الرقم ما ينحفظ ولا ينرسل لأي جهة.</p>
    <div class="msg" id="m" role="status"></div>
  </form>

  <div class="res" id="res"></div>

  <div class="foot">
    <a href="https://tally.so/r/LZQLkj" target="_blank" rel="noopener">أرسل استفسار جديد</a>
    <a href="./#contact">صفحة التواصل</a>
  </div>
  <p class="sig">قسم التربية الإسلامية · مدرسة ابن رشد الإعدادية للبنين</p>
</main>
<script>
(function(){
/* رجوع: لو جاء من الموقع نرجعه لنفس المكان، وإلا لصفحة التواصل */
document.getElementById('back').addEventListener('click',function(e){try{if(document.referrer&&new URL(document.referrer).origin===location.origin&&history.length>1){e.preventDefault();history.back()}}catch(x){}});
var f=document.getElementById('f'),inp=document.getElementById('cpr'),go=document.getElementById('go'),m=document.getElementById('m'),res=document.getElementById('res');
var enc=new TextEncoder(),dec=new TextDecoder();
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function digits(s){return String(s).replace(/[٠-٩]/g,function(c){return '٠١٢٣٤٥٦٧٨٩'.indexOf(c)}).replace(/[۰-۹]/g,function(c){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(c)}).replace(/\D/g,'')}
function say(cls,t){m.className='msg '+cls;m.textContent=t}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
var DATA=null,KEY=null;
function load(){return DATA?Promise.resolve(DATA):fetch('data/rudud.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){DATA=d;return d})}
function show(list){
  res.innerHTML='';
  list.sort(function(a,b){return String(b.d).localeCompare(String(a.d))});
  list.forEach(function(r){
    var c=el('article','rep'),h=el('div','rep-h');
    h.appendChild(el('b',null,'الطالب: '+r.name));
    h.appendChild(el('span',null,[r.cls,r.topic,r.d].filter(Boolean).join(' · ')));
    c.appendChild(h);
    if(r.q){var q=el('div','q');q.appendChild(el('b',null,'استفساركم'));q.appendChild(document.createTextNode(r.q));c.appendChild(q)}
    var a=el('div','a');a.appendChild(el('div','a-who','رد '+(r.teacher||'معلم المادة')));a.appendChild(document.createTextNode(r.a));c.appendChild(a);
    res.appendChild(c)});
  res.scrollIntoView({behavior:'smooth',block:'start'})}
f.addEventListener('submit',function(e){
  e.preventDefault();var code=digits(inp.value);res.innerHTML='';
  if(code.length!==9){say('bad','الرقم الشخصي 9 أرقام. تأكد منه واكتبه كامل.');return}
  if(!(window.crypto&&crypto.subtle)){say('bad','متصفحك ما يدعم فتح الرد. افتح الصفحة من كروم أو سفاري.');return}
  go.disabled=true;say('info','لحظة، نفتح الرد…');
  load().then(function(d){
    return crypto.subtle.importKey('raw',enc.encode(code),'PBKDF2',false,['deriveKey']).then(function(km){
      return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(d.salt),iterations:d.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt','encrypt'])
    }).then(function(k){KEY=k;
      return Promise.all(d.r.map(function(x){
        return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(x.i)},k,b64(x.c)).then(function(p){return JSON.parse(dec.decode(p))},function(){return null})}))
    })
  }).then(function(out){
    out=out.filter(Boolean);
    if(out.length){m.className='msg';show(out)}
    else say('bad','ما في رد مسجّل لهذا الرقم حتى الآن. إذا أرسلت استفسارك قريب فالمعلم بيرد عليك بإذن الله، وتأكد إن الرقم صحيح.');
    bell(out.length>0);
  }).catch(function(){say('bad','تعذّر تحميل الردود. تأكد من اتصالك بالإنترنت وجرّب مرة ثانية.')})
  .then(function(){go.disabled=false})
});
inp.addEventListener('input',function(){var v=digits(inp.value);if(v!==inp.value)inp.value=v});
/* تنبيه الردود: يحفظ مفتاح الفك (غير قابل للاستخراج) على جهاز ولي الأمر فقط، لا الرقم الشخصي */
var SWOK='serviceWorker' in navigator&&'Notification' in window&&'indexedDB' in window;
try{if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');navigator.serviceWorker.ready.then(function(r){if(r.active)r.active.postMessage('rud-check')})}}catch(e){}
function db(){return new Promise(function(ok,no){var q=indexedDB.open('rudud',1);q.onupgradeneeded=function(){q.result.createObjectStore('subs',{keyPath:'fp'})};q.onsuccess=function(){ok(q.result)};q.onerror=function(){no(q.error)}})}
function fp(){return crypto.subtle.encrypt({name:'AES-GCM',iv:new Uint8Array(12)},KEY,new Uint8Array(16)).then(function(b){return Array.from(new Uint8Array(b).slice(0,12)).map(function(v){return v.toString(16).padStart(2,'0')}).join('')})}
function bell(found){var old=document.getElementById('bell');if(old)old.remove();if(!SWOK||!KEY)return;
  var b=el('div','bellbox');b.id='bell';
  b.appendChild(el('b',null,found?'🔔 تبي ينبهك الجوال إذا وصل رد جديد؟':'🔔 تبي ينبهك الجوال أول ما يوصل الرد؟'));
  b.appendChild(el('p',null,'التنبيه يشتغل على هذا الجهاز فقط، ورقم ابنك ما ينحفظ. وللتنبيه وأنت مسكّر الموقع: ثبّت الموقع كتطبيق على جوالك.'));
  var btn=el('button',null,'فعّل التنبيه');btn.type='button';b.appendChild(btn);
  btn.addEventListener('click',function(){btn.disabled=true;
    Notification.requestPermission().then(function(pm){if(pm!=='granted'){btn.textContent='التنبيهات مقفلة في المتصفح';return}
      return Promise.all([fp(),db(),load()]).then(function(v){var rec={fp:v[0],key:KEY,salt:v[2].salt,seen:v[2].r.map(function(x){return x.i}),t:Date.now()};
        return new Promise(function(ok){var q=v[1].transaction('subs','readwrite').objectStore('subs').put(rec);q.onsuccess=ok;q.onerror=ok})})
      .then(function(){return navigator.serviceWorker.ready}).then(function(r){
        if(r.periodicSync)r.periodicSync.register('rud-check',{minInterval:3*3600*1000}).catch(function(){});
        r.showNotification('تم تفعيل تنبيه الردود ✅',{body:'بيوصلك تنبيه أول ما يرد المعلم بإذن الله.',icon:'icons/icon-192.png',lang:'ar',dir:'rtl'});
        btn.textContent='✓ التنبيه مفعّل'})})
    .catch(function(){btn.disabled=false;btn.textContent='جرّب مرة ثانية'})});
  res.parentNode.insertBefore(b,res.nextSibling)}
})();
</script>
</body>
</html>
