  '<label class="gq-name">اسمك (يظهر في رسالة البشارة)<input id="gqn" maxlength="30" autocomplete="off" placeholder="مثال: محمد" value="'+esc(GS.name)+'"></label>'+
  '<fieldset class="gq-les"><legend>الدروس</legend><button class="gq-l on" data-gles="all">كل الدروس</button>'+B.lessons.map(function(l,i){return '<button class="gq-l" data-gles="'+i+'">'+esc(l)+'</button>'}).join('')+'</fieldset>'+

 GS.list=pool.slice(0,Math.min(GL.length,pool.length));GS.spare=pool.slice(GS.list.length);GS.i=0;GS.hearts=3;GS.pts=0;GS.ok=0;GS.miss=[];GS.life={ff:1,aud:1,sw:1};gQ()}

 '<div class="gq-opts">'+GS.opts.map(function(op,k){return '<button class="gq-o" data-gopt="'+k+'"><i>'+'أبجد'.charAt(k)+'</i><span>'+esc(op.t)+'</span></button>'}).join('')+'</div>'+
 '<div class="gq-life"><button data-glife="ff"'+(GS.life.ff?'':' disabled')+'><b>50:50</b><span>حذف إجابتين</span></button><button data-glife="aud"'+(GS.life.aud?'':' disabled')+'><b>👥</b><span>رأي الزملاء</span></button><button data-glife="sw"'+(GS.life.sw&&GS.spare.length?'':' disabled')+'><b>🔄</b><span>تبديل السؤال</span></button></div><div id="gqx"></div></div></section>';
 o.innerHTML=gFrame(h);var cur=o.querySelector('.gq-ladder .cur');if(cur&&cur.scrollIntoView)try{cur.scrollIntoView({block:'nearest'})}catch(_){}
 if(GS.tm)clearInterval(GS.tm);GS.tm=setInterval(function(){if(!GS||GS.lock)return;GS.left--;var s=document.getElementById('gqs'),c=document.getElementById('gqt');if(s)s.textContent=GS.left;if(c){c.style.strokeDashoffset=(119.4*(1-GS.left/30)).toFixed(1);c.classList.toggle('warn',GS.left<=10)}if(GS.left<=0){clearInterval(GS.tm);gAnswer(-1)}},1000)}
function gAnswer(k){if(GS.lock)return;GS.lock=true;clearInterval(GS.tm);var o=gEl(),bs=o.querySelectorAll('.gq-o'),ci=GS.opts.findIndex(function(x){return x.c}),q=GS.list[GS.i];
 if(k>=0)bs[k].classList.add('pick');[].forEach.call(bs,function(b){b.disabled=true});
 setTimeout(function(){if(!GS)return;var right=k===ci;bs[ci].classList.add('ok');if(k>=0&&!right)bs[k].classList.add('no');
  if(right){GS.ok++;GS.pts=GL[GS.i]}else{GS.hearts--;GS.miss.push(q)}
  var last=GS.i>=GS.list.length-1||GS.hearts<=0;
  document.getElementById('gqx').innerHTML='<div class="gq-exp '+(right?'good':'bad')+'"><b>'+(right?['أحسنت! 🌟','ممتاز! ✨','بطل! 🏅','ما شاء الله! 💫'][GS.i%4]:k<0?'انتهى الوقت ⏱️':'إجابة غير صحيحة')+'</b><p>'+esc(q[4])+'</p><button class="gq-go" data-gnext="1">'+(last?'شوف نتيجتك ←':'السؤال التالي ←')+'</button></div>';
  var hh=o.querySelector('.gq-hearts');if(hh)hh.innerHTML='❤️'.repeat(Math.max(0,GS.hearts))+'<s>'+'🤍'.repeat(3-Math.max(0,GS.hearts))+'</s>';var pp=o.querySelector('.gq-pts');if(pp)pp.innerHTML=GS.pts.toLocaleString('ar')+' <small>نقطة</small>';

function gLife(t){if(GS.lock||!GS.life[t])return;GS.life[t]=0;var o=gEl(),bs=o.querySelectorAll('.gq-o'),ci=GS.opts.findIndex(function(x){return x.c});o.querySelector('[data-glife="'+t+'"]').disabled=true;

 if(t==='aud'){var p=[0,0,0,0],r=55+Math.floor(Math.random()*25);p[ci]=r;var rest=100-r,oth=[0,1,2,3].filter(function(k){return k!==ci&&!bs[k].classList.contains('gone')});oth.forEach(function(k,j){var v=j===oth.length-1?rest:Math.floor(Math.random()*rest);p[k]=v;rest-=v});
