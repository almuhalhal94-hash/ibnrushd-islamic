name: تحديث مساحة المعلمين
on:
  push:
    branches: [main]
    paths: ['site.html', 'tl/**', 'vid/**', 'img/mag/**', 'tilawa-file.html', 'src/build_teachers.py', 'src/teachers_template.html', 'src/teachers.json', 'data/**', 'src/tawthiq.json', 'src/add_doc.py', 'mualim/d/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install cryptography pillow && sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: بناء الصفحة
        run: python3 src/build_teachers.py
      - name: حفظ التحديث
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A mualim src/tawthiq.json
          git diff --cached --quiet || (git commit -m "تحديث تلقائي لمساحة المعلمين" && git push)
