<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#053524"><link rel="icon" href="../../icons/icon-192.png">
<title>إدخال نتائج الشعب</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Readex+Pro:wght@300;400;600&display=swap">
<style>
/* one card per step: who and which class, the class numbers, then the competencies of that grade's paper */
:root{--bg:#f3f5f0;--surface:#fff;--surface2:#eef2ec;--ink:#10251c;--muted:#5b6d63;--line:#d9e1da;--green:#0a6e4b;--deep:#053524;--gold:#b8862b;--gold-bright:#e9b44c;--ok:#1f7a4d;--ok-bg:#e3f3ea;--bad:#a3322b;--bad-bg:#f9e3e0;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#07140e;--surface:#0e2119;--surface2:#132b21;--ink:#e8efe9;--muted:#9db3a6;--line:#24423a;--green:#45b88a;--deep:#03110b;--gold:#e3b155;--ok:#6fd3a0;--ok-bg:#123a28;--bad:#f19a90;--bad-bg:#3d1916;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#07140e;--surface:#0e2119;--surface2:#132b21;--ink:#e8efe9;--muted:#9db3a6;--line:#24423a;--green:#45b88a;--deep:#03110b;--gold:#e3b155;--ok:#6fd3a0;--ok-bg:#123a28;--bad:#f19a90;--bad-bg:#3d1916;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 "Readex Pro","Segoe UI",Tahoma,sans-serif}
button,input,select{font:inherit;color:inherit}
.mast{background:var(--deep);color:#f4efe0;padding:18px 16px 16px;text-align:center}
.mast h1{font-family:"Aref Ruqaa",serif;color:#f0c46a;font-size:clamp(26px,6vw,34px);margin:0;line-height:1.3}
.mast p{margin:2px 0 0;font-size:13px;opacity:.85}
main{max-width:760px;margin:0 auto;padding:18px 16px 60px;display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
h2{font-size:16px;margin:0 0 10px;display:flex;gap:8px;align-items:center}
h2 b{background:var(--green);color:#fff;border-radius:50%;width:24px;height:24px;display:inline-grid;place-items:center;font-size:13px;flex:none}
.fg{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
label.f input,label.f select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 10px;font-size:15px;width:100%;min-width:0}
.muted{color:var(--muted)}.small{font-size:13px}
.kq{display:grid;grid-template-columns:30px minmax(0,1fr) 84px 54px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.kq:last-child{border-bottom:0}
.kq .n{color:var(--muted);font-size:12px}.kq .s{font-size:13.5px}.kq .p{font-size:12.5px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.kq input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px;text-align:center;width:100%}
.km{margin:12px 0 2px;font-weight:600;font-size:13.5px;color:var(--gold)}
.btn{border:0;background:var(--green);color:#fff;border-radius:12px;padding:12px 18px;font-size:16px;font-weight:600;cursor:pointer;width:100%}
.btn[disabled]{opacity:.6;cursor:progress}
.msg{border-radius:10px;padding:10px 12px;font-size:14px}
.msg.ok{background:var(--ok-bg);color:var(--ok)}.msg.bad{background:var(--bad-bg);color:var(--bad)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--gold-bright);outline-offset:2px}
</style></head><body>
<header class="mast"><h1>إدخال نتائج الشعب</h1><p>قسم التربية الإسلامية · مدرسة ابن رشد الإعدادية للبنين</p></header>
<main>
  <section class="card">
    <h2><b>١</b> الاختبار والشعبة</h2>
    <div class="fg">
      <label class="f">الاختبار<select id="kind"></select></label>
      <label class="f">الشعبة<select id="cls"><option value="">اختر الشعبة</option></select></label>
    </div>
    <p class="small muted" id="who" style="margin:8px 0 0"></p>
  </section>
  <section class="card" id="s2" hidden>
    <h2><b>٢</b> نتائج الشعبة</h2>
    <div class="fg">
      <label class="f">عدد الطلبة<input id="n" inputmode="numeric"></label>
      <label class="f">الغياب<input id="abs" inputmode="numeric"></label>
      <label class="f">الناجحون<input id="pass" inputmode="numeric"></label>
      <label class="f">المتقنون<input id="master" inputmode="numeric"></label>
      <label class="f">المتوسط<input id="avg" inputmode="decimal"></label>
    </div>
    <p class="small muted" style="margin:8px 0 0">«المتقنون» عدد الطلبة اللي وصلوا حد الإتقان (80٪ من الدرجة).</p>
  </section>
  <section class="card" id="s3" hidden>
    <h2><b>٣</b> الكفايات</h2>
    <p class="small muted" style="margin:0 0 6px">اكتب عند كل كفاية عدد الطلبة المتقنين لها. غير المتقنين ينحسبون من عدد الحاضرين: <b id="att">—</b>.</p>
    <div id="kafs"></div>
  </section>
  <div id="send" hidden>
    <button class="btn" id="go">إرسال للمعلم الأول</button>
    <p class="msg" id="msg" hidden style="margin-top:10px"></p>
  </div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../config.js?v=2026-10-26"></script>
<script src="../kaf.js?v=2026-10-27"></script>
<script>
(function(){
"use strict";
var KAF=window.MAKTAB_KAF||{},CLS=window.MAKTAB_CLS||[],EK=['خط الأساس (العام الماضي)','وقفة تقويمية','اختبار قصير','الاختبار الأول','الاختبار الثاني','اختبار نهاية الفصل'];
var GN={'6ب':'السادس الابتدائي','1ع':'الأول الإعدادي','2ع':'الثاني الإعدادي','3ع':'الثالث الإعدادي'};
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function num(id){var v=$(id).value.trim().replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)});return v===''?null:+v}
$('kind').innerHTML=Object.keys(KAF).map(function(k){return '<option>'+esc(k)+'</option>'}).join('');
var gi='';$('cls').innerHTML+=CLS.map(function(c){var g=c[0].slice(0,2),h=g!==gi?(gi?'</optgroup>':'')+'<optgroup label="'+GN[g]+'">':'';gi=g;return h+'<option value="'+c[0]+'">'+c[0]+'</option>'}).join('')+'</optgroup>';
function teacher(){var c=$('cls').value,x=CLS.filter(function(r){return r[0]===c})[0];return x?x[1]:''}
function att(){var n=num('n'),a=num('abs')||0;return n?n-a:0}
function draw(){
  var c=$('cls').value,on=!!c;['s2','s3','send'].forEach(function(i){$(i).hidden=!on});$('msg').hidden=true;
  $('who').textContent=on?'معلم الشعبة: '+teacher():'';if(!on)return;
  var map=(KAF[$('kind').value]||{})[c.slice(0,2)];
  if(!map){$('kafs').innerHTML='<p class="small muted">ما في ورقة كفايات لهذا الصف في هذا الاختبار.</p>';return}
  var last='';$('kafs').innerHTML=map.map(function(it,i){var h=it[0]!==last?'<div class="km">'+esc(it[0])+'</div>':'';last=it[0];
    return h+'<div class="kq"><span class="n">س'+(i+1)+'</span><span class="s">'+esc(it[1])+' <span class="muted small">('+it[2]+')</span></span><input data-q="'+(i+1)+'" inputmode="numeric" aria-label="المتقنون س'+(i+1)+'"><span class="p" data-p="'+(i+1)+'">—</span></div>'}).join('');
  live();
}
function live(){var T=att();$('att').textContent=T||'—';[].forEach.call(document.querySelectorAll('[data-q]'),function(i){var p=document.querySelector('[data-p="'+i.dataset.q+'"]'),v=i.value.trim();p.textContent=v===''||!T?'—':Math.round(Math.min(1,+v/T)*100)+'٪'})}
$('kind').onchange=draw;$('cls').onchange=draw;
document.addEventListener('input',function(e){if(e.target.matches('#n,#abs,[data-q]'))live()});
var DB=null,FB=window.MAKTAB_FIREBASE;
try{if(FB&&window.firebase){firebase.initializeApp(FB);DB=firebase.firestore()}}catch(e){}
function say(t,ok){var m=$('msg');m.hidden=false;m.className='msg '+(ok?'ok':'bad');m.textContent=t}
$('go').onclick=function(){
  var c=$('cls').value,n=num('n'),a=num('abs')||0,ps=num('pass'),ms=num('master'),T=att(),q={},err='';
  if(!c)return say('اختر الشعبة.');
  [].forEach.call(document.querySelectorAll('[data-q]'),function(i){var v=i.value.trim();if(v==='')return;var m=+v.replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)});if(isNaN(m)||m<0){err=err||'س'+i.dataset.q+': اكتب رقم.';return}if(T&&m>T)err=err||'س'+i.dataset.q+': المتقنون أكثر من الحاضرين ('+T+').';q[i.dataset.q]=Math.round(m)});
  if(!n&&!Object.keys(q).length)return say('عبّي عدد الطلبة أو أرقام الكفايات.');
  if(Object.keys(q).length&&!T)return say('اكتب عدد الطلبة والغياب عشان تنحسب الكفايات.');
  if(n&&((ps||0)>T||(ms||0)>T))err=err||'الناجحون أو المتقنون أكثر من الحاضرين.';
  if(err)return say(err);
  if(!DB)return say('الإرسال غير متاح الحين، جرّب بعد شوي.');
  var k=$('kind').value,doc={kind:k,cls:c,t:teacher(),n:Math.round(n||0),abs:Math.round(a),pass:Math.round(ps||0),master:Math.round(ms||0),avg:num('avg'),q:q,att:Math.round(T),at:new Date().toISOString()};
  $('go').disabled=true;
  DB.collection('kafin').doc('k'+EK.indexOf(k)+'_'+c).set(doc).then(function(){say('✓ وصلت نتائج '+c+' للمعلم الأول. لو عدّلت شي أرسلها مرة ثانية.',true)})
  .catch(function(e){say('ما وصلت ('+((e&&e.code)||'خطأ')+'). تأكد من الإنترنت وجرّب مرة ثانية.')}).then(function(){$('go').disabled=false});
};
draw();
})();
</script>
</body></html>
