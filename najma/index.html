<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffb703">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="نجمتي">
<meta name="robots" content="noindex">
<title>نجمتي · رحلة الحفظ والإنجليزي</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
@font-face{font-family:Kid;src:url(fonts/kid500.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:Kid;src:url(fonts/kid700.woff2) format('woff2');font-weight:700 900;font-display:swap}
@font-face{font-family:Kid;src:url(fonts/kidl700.woff2) format('woff2');font-weight:500 900;unicode-range:U+0000-024F;font-display:swap}
@font-face{font-family:Quran;src:url(fonts/quran.woff2) format('woff2');font-display:swap}
@font-face{font-family:En;src:url(fonts/en400.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:En;src:url(fonts/en700.woff2) format('woff2');font-weight:700;font-display:swap}
:root{--bg:#fff8ee;--bg2:#fff1dc;--card:#ffffff;--ink:#2b2d42;--muted:#6c6f86;--line:#f1e3cc;
--sun:#ffb703;--sun2:#ffd166;--mint:#2ec4b6;--mint2:#cbf3ec;--sky:#4cc9f0;--sky2:#d6f3fd;--rose:#ff6b8b;--rose2:#ffe0e8;--lav:#9b72cf;--lav2:#ece2fa;--ok:#22a06b;--no:#e5484d;
--sh:0 6px 0 rgba(0,0,0,.08),0 10px 24px rgba(43,45,66,.08);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#171a33;--bg2:#1f2342;--card:#252a4d;--ink:#f6f4ff;--muted:#b6b8d6;--line:#343a66;--mint2:#16443f;--sky2:#14385a;--rose2:#4a2232;--lav2:#33284f;--sh:0 6px 0 rgba(0,0,0,.25),0 10px 24px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme=dark]{--bg:#171a33;--bg2:#1f2342;--card:#252a4d;--ink:#f6f4ff;--muted:#b6b8d6;--line:#343a66;--mint2:#16443f;--sky2:#14385a;--rose2:#4a2232;--lav2:#33284f;--sh:0 6px 0 rgba(0,0,0,.25),0 10px 24px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Kid,'Segoe UI',Tahoma,sans-serif;font-size:18px;line-height:1.5;-webkit-user-select:none;user-select:none}
body{min-height:100dvh;background:radial-gradient(circle at 10% 0%,var(--bg2),transparent 40%),radial-gradient(circle at 100% 30%,var(--bg2),transparent 35%),var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 28px);min-height:100dvh;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;gap:10px}
.top .ttl{flex:1;font-weight:800;font-size:1.25rem;line-height:1.2}.top .ttl small{display:block;font-weight:500;font-size:.85rem;color:var(--muted)}
.ib{width:52px;height:52px;border-radius:18px;border:0;background:var(--card);box-shadow:var(--sh);font-size:1.4rem;display:grid;place-items:center;flex:none}
.card{background:var(--card);border-radius:28px;padding:18px;box-shadow:var(--sh)}
.hero{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,var(--sun2),var(--sun));color:#4a2c00;border-radius:32px;padding:18px;box-shadow:var(--sh);position:relative;overflow:hidden}
.hero h1{margin:0;font-size:1.6rem;line-height:1.25}.hero p{margin:4px 0 0;font-weight:700}
.hero .mascot{width:96px;height:96px;flex:none}
.big{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:84px;border:0;border-radius:28px;font-size:1.5rem;font-weight:800;color:#fff;background:linear-gradient(180deg,#3ad6c8,var(--mint));box-shadow:0 8px 0 #1c8f85,0 14px 24px rgba(46,196,182,.35);transition:transform .1s}
.big:active{transform:translateY(5px);box-shadow:0 3px 0 #1c8f85}
.big.sun{background:linear-gradient(180deg,#ffd166,var(--sun));color:#4a2c00;box-shadow:0 8px 0 #c98800,0 14px 24px rgba(255,183,3,.35)}.big.sun:active{box-shadow:0 3px 0 #c98800}
.big.rose{background:linear-gradient(180deg,#ff8fa8,var(--rose));box-shadow:0 8px 0 #c23d5c,0 14px 24px rgba(255,107,139,.35)}.big.rose:active{box-shadow:0 3px 0 #c23d5c}
.big.sky{background:linear-gradient(180deg,#7fdcf7,var(--sky));color:#08324a;box-shadow:0 8px 0 #1f93b8,0 14px 24px rgba(76,201,240,.35)}.big.sky:active{box-shadow:0 3px 0 #1f93b8}
.big.lav{background:linear-gradient(180deg,#b996e3,var(--lav));box-shadow:0 8px 0 #6b47a0,0 14px 24px rgba(155,114,207,.35)}.big.lav:active{box-shadow:0 3px 0 #6b47a0}
.big.ghost{background:var(--card);color:var(--ink);box-shadow:var(--sh);font-size:1.2rem;min-height:64px}
.big[disabled]{opacity:.45;pointer-events:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{border:0;border-radius:28px;padding:16px 10px;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:1.15rem;box-shadow:var(--sh);background:var(--card)}
.tile i{font-style:normal;font-size:2.4rem;line-height:1}.tile small{font-weight:500;color:var(--muted);font-size:.85rem}
.tile.m{background:var(--mint2)}.tile.s{background:var(--sky2)}.tile.r{background:var(--rose2)}.tile.l{background:var(--lav2)}
.row{display:flex;gap:12px;align-items:center}.grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--bg2);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.95rem}
.steps{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.steps i{width:28px;height:10px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--sun)}.steps i.done{background:var(--mint)}
.stitle{text-align:center}.stitle b{display:block;font-size:1.6rem;line-height:1.3}.stitle span{color:var(--muted);font-weight:700}
.ayat{font-family:Quran,serif;font-size:2rem;line-height:2.2;text-align:center;direction:rtl;-webkit-user-select:text;user-select:text}
.ay{display:inline;padding:2px 6px;border-radius:14px;transition:background .3s}.ay.now{background:var(--sun2);color:#3a2300;box-shadow:0 0 0 4px var(--sun2)}
.ay .num{font-family:Kid;font-size:1rem;display:inline-grid;place-items:center;width:1.9em;height:1.9em;border-radius:50%;border:2px solid var(--sun);margin:0 4px;vertical-align:middle;color:var(--ink)}
.ayat.hide .ay{color:transparent;text-shadow:0 0 16px rgba(120,120,140,.6)}.ayat.hide .ay .num{color:var(--ink);text-shadow:none}
.basm{display:block;font-family:Quran,serif;font-size:1.5rem;color:var(--muted);text-align:center}
.counter{display:flex;justify-content:center;gap:10px}.counter i{width:42px;height:42px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-style:normal;font-size:1.3rem;transition:transform .2s}.counter i.on{background:var(--sun);transform:scale(1.1)}
.mark{display:flex;align-items:center;gap:10px;background:var(--bg2);border-radius:20px;padding:10px 12px}.mark .q{flex:1;font-family:Quran,serif;font-size:1.35rem;line-height:1.9}
.mark button{width:56px;height:56px;border-radius:18px;border:0;font-size:1.5rem;box-shadow:var(--sh);background:var(--card)}.mark button.ok.on{background:var(--ok);color:#fff}.mark button.no.on{background:var(--no);color:#fff}
.note{background:var(--sky2);border-radius:20px;padding:12px 14px;font-weight:700}.note.warn{background:var(--rose2)}
.timer{font-size:3.4rem;font-weight:900;text-align:center;font-variant-numeric:tabular-nums}
.move{font-size:5rem;text-align:center;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px) rotate(-4deg)}}
.letter{font-family:En,sans-serif;font-weight:700;font-size:7rem;line-height:1;text-align:center;direction:ltr}
.en{font-family:En,sans-serif;direction:ltr}
.wcard{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:var(--card);border-radius:24px;padding:14px 8px;box-shadow:var(--sh);font-family:En,sans-serif;font-weight:700;font-size:1.3rem}
.wcard .em{font-size:3rem;line-height:1.1}.wcard.ok{background:#c9f7df}.wcard.no{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.wgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.wgrid.g3{grid-template-columns:repeat(3,1fr)}
.tilesL{display:flex;gap:10px;justify-content:center;direction:ltr;flex-wrap:wrap}
.lt{min-width:74px;height:84px;border:0;border-radius:20px;background:var(--sky2);font-family:En,sans-serif;font-weight:700;font-size:2.6rem;box-shadow:var(--sh);padding:0 10px}
.lt.used{opacity:.35}
.slot{min-width:74px;height:84px;border-radius:20px;border:3px dashed var(--sky);display:grid;place-items:center;font-family:En,sans-serif;font-weight:700;font-size:2.6rem}
.trace{width:100%;aspect-ratio:1;background:var(--card);border-radius:28px;box-shadow:var(--sh);touch-action:none;display:block}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mem button{aspect-ratio:1;border:0;border-radius:20px;font-size:2.4rem;background:linear-gradient(135deg,var(--lav),#c3a6ee);color:#fff;box-shadow:var(--sh);font-family:En,sans-serif;font-weight:700}
.mem button.open{background:var(--card);color:var(--ink);font-size:2rem}.mem button.done{background:#c9f7df;color:var(--ink)}
.map{position:relative}.map svg{width:100%;height:auto;display:block}
.stars{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.stars span{aspect-ratio:1;display:grid;place-items:center;font-size:1.8rem;border-radius:16px;background:var(--bg2)}.stars span.on{background:var(--sun2)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.badge{text-align:center;padding:12px 6px;border-radius:20px;background:var(--bg2);font-size:.85rem;font-weight:700}.badge i{display:block;font-style:normal;font-size:2.2rem;filter:grayscale(1);opacity:.35}.badge.on i{filter:none;opacity:1}.badge.on{background:var(--sun2);color:#4a2c00}
.chest{font-size:6rem;text-align:center;animation:bob 1.6s ease-in-out infinite}
/* parent */
.pf label{display:flex;flex-direction:column;gap:6px;font-weight:700;margin-bottom:12px}
.pf input,.pf select,.pf textarea{font:inherit;font-size:1rem;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);-webkit-user-select:text;user-select:text}
.ptabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.ptabs::-webkit-scrollbar{display:none}.ptabs button{flex:none;border:0;border-radius:999px;padding:10px 14px;background:var(--card);box-shadow:var(--sh);font-weight:700;font-size:.95rem}.ptabs button.on{background:var(--ink);color:var(--bg)}
table.wk{width:100%;border-collapse:collapse;font-size:.9rem}table.wk td,table.wk th{border-bottom:1px solid var(--line);padding:8px 4px;text-align:start;vertical-align:top}
.chk{display:flex;flex-wrap:wrap;gap:8px}.chk label{display:flex;align-items:center;gap:6px;background:var(--bg2);border-radius:14px;padding:8px 12px;font-weight:700;flex-direction:row;margin:0}
.chk input{width:22px;height:22px}
.pin{display:flex;justify-content:center;gap:12px;margin:10px 0}.pin i{width:22px;height:22px;border-radius:50%;background:var(--line)}.pin i.on{background:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pad button{height:68px;border:0;border-radius:20px;background:var(--card);box-shadow:var(--sh);font-size:1.6rem;font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:700;z-index:50;box-shadow:var(--sh);max-width:90vw;text-align:center}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
.cele{text-align:center}.cele b{font-size:2rem;display:block}.cele .bigstar{font-size:7rem;line-height:1;animation:spin 1.2s ease}
@keyframes spin{from{transform:scale(.2) rotate(-180deg)}to{transform:none}}
.rest{text-align:center}.rest .moon{font-size:6rem}
.muted{color:var(--muted)}.c{text-align:center}.mt{margin-top:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<canvas id="fx" aria-hidden="true"></canvas>
<noscript>هذا التطبيق يحتاج تفعيل JavaScript.</noscript>
<script src="quran.js"></script>
<script src="en.js"></script>
<script src="app.js"></script>
</body>
</html>
